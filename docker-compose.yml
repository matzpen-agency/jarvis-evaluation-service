services:
  evaluation-service:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    ports:
      - "5002:5002"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - shared-net
networks:
  shared-net:
    external: true
