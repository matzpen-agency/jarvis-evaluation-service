[project]
name = "jarvis-evaluation-service"
version = "0.1.0"
description = "Generic AI Evaluation Platform — Text-to-SQL use case"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langfuse>=2.56.0",
    "httpx>=0.28.0",
    "trino>=0.328.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=25.0.0",
    "numpy>=2.0.0",
    "python-core-utils[postgres] @ git+ssh://git@github.com/matzpen-agency/python-core-utils.git",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.22.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort / import sorting
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "T20",  # flake8-print
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # Let formatter handle line wrapping
    "B904",  # Allow raising without 'from' in HTTP exception wrappers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "N802"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
disable_error_code = [
    "attr-defined",
    "union-attr",
    "arg-type",
    "assignment",
    "list-item",
    "type-arg",
    "var-annotated",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests with mocked external services",
    "e2e: full end-to-end tests",
]
